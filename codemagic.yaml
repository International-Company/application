workflows:

  # تطبيق المبدع — نسخة تجربة قابلة للتثبيت مباشرة
  creator-debug:
    name: Creator app - debug APK
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      java: 17
      vars:
        API_BASE_URL: "https://application-production-2810.up.railway.app"
        TIKTOK_SIGNATURES: ""
    scripts:
      - name: Prepare Gradle wrapper
        script: |
          cd creator-app
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew
      - name: Build debug APK
        script: |
          cd creator-app
          ./gradlew clean assembleDebug \
            -PapiBaseUrl="$API_BASE_URL" \
            -PtiktokSignatures="$TIKTOK_SIGNATURES" \
            --no-daemon --stacktrace
    artifacts:
      - creator-app/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - drdr3226@gmail.com

  # تطبيق الجامع — يُثبَّت على هاتف الشركة وحده
  collector-debug:
    name: Collector app - debug APK
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      java: 17
    scripts:
      - name: Prepare Gradle wrapper
        script: |
          cd collector-app
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew
      - name: Build debug APK
        script: |
          cd collector-app
          ./gradlew clean assembleDebug --no-daemon --stacktrace
    artifacts:
      - collector-app/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - drdr3226@gmail.com
